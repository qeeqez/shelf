[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shelf"
version = "0.1.0"
description = "Download books you have access to as EPUB, PDF, and web"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "cryptography>=50.0.2",
    "rich>=15.0.0",
    "platformdirs>=4.13.3",
]

# --pdf prefers WeasyPrint (CSS paged media); it also needs system Pango.
# Without it, shelf falls back to a headless Chromium browser.
[project.optional-dependencies]
pdf = ["weasyprint>=70.0"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[project.scripts]
shelf = "shelf.cli:main"

[tool.setuptools.packages.find]
include = ["shelf*"]
